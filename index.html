<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Maddy Blast</title>
    <style>
      /* Shared colors, page layout, and theme variants. */
      :root {
        --bg: #e8dccf;
        --fg: #2a1a22;
        --red: #d62839;
        --green: #2f8f4e;
        --board: #1b1022;
        --cream: #fff3e4;
        box-sizing: border-box;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0f0813;
          --fg: #f3e9ee;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0f0813;
        --fg: #f3e9ee;
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        box-sizing: border-box;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      #stage {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #g {
        container-type: inline-size;
        position: relative;
        border-radius: 14px;
        overflow: hidden;
        background: var(--board);
        box-shadow: 0 0 0 3px var(--red);
      }
      #wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .side {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .wide .side {
        display: flex;
      }
      .mas {
        width: 100%;
        max-width: 190px;
        filter: drop-shadow(0 8px 0 rgba(0, 0, 0, 0.2));
        animation: bob 2.4s ease-in-out infinite;
      }
      .mas.flip {
        animation-name: bob2;
        animation-delay: -1.2s;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0) rotate(-4deg);
        }
        50% {
          transform: translateY(-12px) rotate(4deg);
        }
      }
      @keyframes bob2 {
        0%,
        100% {
          transform: scaleX(-1) translateY(0) rotate(-4deg);
        }
        50% {
          transform: scaleX(-1) translateY(-12px) rotate(4deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mas {
          animation: none;
        }
      }
      .card {
        width: 100%;
        max-width: 200px;
        box-sizing: border-box;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--board);
        color: var(--cream);
        box-shadow: 0 0 0 2px var(--red);
        text-align: center;
      }
      .card > span {
        display: block;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #c9b8cf;
      }
      .card b {
        display: block;
        font:
          400 38px/1.1 Impact,
          "Arial Black",
          sans-serif;
      }
      .card.hi b {
        color: #ffd166;
        font-size: 30px;
      }
      .lbc {
        padding: 10px 12px;
      }
      #lb {
        list-style: none;
        counter-reset: n;
        margin: 6px 0 0;
        padding: 0;
        text-align: left;
        font-size: 14px;
      }
      #lb li {
        display: flex;
        gap: 6px;
        padding: 2px 0;
        counter-increment: n;
      }
      #lb li::before {
        content: counter(n) ".";
        opacity: 0.55;
        min-width: 1.2em;
      }
      #lb li span {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #lb li.me {
        color: #ffd166;
      }
      #lb li b {
        font:
          700 14px system-ui,
          sans-serif;
        color: inherit;
      }
      #lb li.none::before {
        content: "";
      }
      /* Name entry, overlay text, and start/game-over controls. */
      #nm {
        font:
          600 max(18px, 4.4cqw) system-ui,
          sans-serif;
        text-align: center;
        width: min(70%, 16em);
        box-sizing: border-box;
        padding: 0.5em 0.8em;
        border-radius: 12px;
        border: 3px solid var(--cream);
        background: #2d1a38;
        color: var(--cream);
        outline: none;
      }
      #nm:focus {
        border-color: #ffd166;
      }
      #nm.err {
        border-color: var(--red);
        animation: shk 0.3s;
      }
      @keyframes shk {
        25% {
          transform: translateX(-6px);
        }
        75% {
          transform: translateX(6px);
        }
      }
      #ov #lbo {
        font-size: max(13px, 3cqw);
        color: #c9b8cf;
        max-width: 36ch;
      }
      .wide #lbo {
        display: none;
      }
      /* Compact status bar and horizontal leaderboard for narrow screens. */
      #mid {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      #bar,
      #strip {
        display: none;
        box-sizing: border-box;
        align-items: center;
        gap: 10px;
        height: 44px;
        padding: 0 10px;
        border-radius: 12px;
        background: var(--board);
        color: var(--cream);
        box-shadow: 0 0 0 2px var(--red);
        overflow: hidden;
      }
      .narrow #bar,
      .narrow #strip {
        display: flex;
      }
      #bar .mini {
        height: 34px;
        width: auto;
      }
      .stats {
        display: flex;
        gap: 10px;
        flex: 1;
        min-width: 0;
        font-size: 13px;
        color: #c9b8cf;
        white-space: nowrap;
      }
      .stats b {
        color: var(--cream);
        font-size: 15px;
      }
      #tbox {
        display: flex;
        gap: 6px;
      }
      .narrow .tools {
        position: static;
      }
      .narrow .tools button {
        width: 34px;
        height: 34px;
        font-size: 15px;
      }
      #lb2 {
        list-style: none;
        counter-reset: n;
        margin: 0;
        padding: 0;
        display: flex;
        gap: 16px;
        flex: 1;
        min-width: 0;
        font-size: 13px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      #lb2::-webkit-scrollbar {
        display: none;
      }
      #lb2 li {
        display: flex;
        gap: 4px;
        flex: none;
        white-space: nowrap;
        counter-increment: n;
      }
      #lb2 li::before {
        content: counter(n) ".";
        opacity: 0.55;
      }
      #lb2 li span {
        white-space: nowrap;
      }
      #lb2 li.me {
        color: #ffd166;
      }
      #lb2 li.none::before {
        content: "";
      }
      .short .mas {
        display: none;
      }
      .short .card {
        padding: 6px 10px;
      }
      .short .card b {
        font-size: 26px;
      }
      .short .card.hi b {
        font-size: 22px;
      }
      .short #lb {
        font-size: 12px;
      }
      /* Hide the short leaderboard summary when it is not needed. */
      #lbo {
        display: none;
      }
      @media (max-height: 520px) {
        #ov img {
          display: none;
        }
        #ov {
          gap: 10px;
        }
      }
      .lnk {
        width: 100%;
        margin-top: 8px;
        padding: 5px 10px;
        border-radius: 8px;
        border: 1px solid var(--cream);
        background: none;
        color: var(--cream);
        font-size: 13px;
        cursor: pointer;
      }
      .lnk:hover {
        background: var(--red);
      }
      .ib {
        flex: none;
        background: none;
        border: 0;
        font-size: 20px;
        padding: 0;
        cursor: pointer;
      }
      #ov.kb img,
      #ov.kb p {
        display: none;
      }
      /* Full-screen leaderboard dialog and its table. */
      #lbm {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: rgba(10, 5, 15, 0.72);
      }
      #lbm[hidden] {
        display: none;
      }
      .mb {
        width: min(480px, 100%);
        max-height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--board);
        color: var(--cream);
        border-radius: 14px;
        box-shadow: 0 0 0 3px var(--red);
      }
      .mh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        font:
          400 26px Impact,
          "Arial Black",
          sans-serif;
        letter-spacing: 0.03em;
      }
      .mh button {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 2px solid var(--cream);
        background: #2d1a38;
        color: var(--cream);
        font-size: 16px;
        cursor: pointer;
        padding: 0;
      }
      .ms {
        overflow: auto;
        padding: 0 16px 14px;
      }
      #lbt {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
      }
      #lbt th {
        position: sticky;
        top: 0;
        background: var(--board);
        text-align: left;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #c9b8cf;
        padding: 6px 4px;
      }
      #lbt td {
        padding: 7px 4px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      #lbt td:first-child {
        opacity: 0.6;
        width: 2em;
      }
      #lbt tr.me td {
        color: #ffd166;
      }
      /* Game canvas, utility buttons, and the start overlay. */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .tools {
        position: absolute;
        top: 9px;
        right: 9px;
        display: flex;
        gap: 8px;
      }
      .tools button {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid var(--cream);
        background: #2d1a38;
        color: var(--cream);
        font-size: 18px;
        cursor: pointer;
        padding: 0;
      }
      .tools button.on {
        background: var(--red);
      }
      button:focus-visible {
        outline: 3px solid #ffd166;
        outline-offset: 2px;
      }
      #ov {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: max(14px, 3cqw);
        padding: 28px;
        text-align: center;
        background: rgba(20, 10, 28, 0.9);
        color: var(--cream);
      }
      #ov.hide {
        display: none;
      }
      #ov h1 {
        margin: 0;
        font:
          400 max(44px, 11cqw)/1 Impact,
          "Arial Black",
          sans-serif;
        letter-spacing: 0.02em;
        color: var(--cream);
        text-shadow: 3px 3px 0 var(--red);
      }
      #ov p {
        margin: 0;
        max-width: 30ch;
        line-height: 1.45;
        font-size: max(17px, 4.2cqw);
      }
      #ov img {
        width: max(130px, 30cqw);
        transform: rotate(-6deg);
      }
      #go {
        font:
          400 max(26px, 6.4cqw) Impact,
          "Arial Black",
          sans-serif;
        letter-spacing: 0.04em;
        padding: 0.5em 1.4em;
        border: 0;
        border-radius: 12px;
        background: var(--red);
        color: #fff;
        cursor: pointer;
        box-shadow: 0 5px 0 #7d1520;
      }
      #go:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #7d1520;
      }
    </style>
  </head>
  <body>
    <!-- Main game layout: side stats, board, and compact mobile status bars. -->
    <div id="app">
      <div id="stage">
        <div id="wrap">
          <div class="side">
            <img class="mas" alt="" />
            <div class="card"><span>Hits</span><b id="sh">0</b></div>
            <div class="card hi"><span>Your best hits</span><b id="sbh">0</b></div>
            <div class="card lbc">
              <span id="lbh">Leaderboard</span>
              <ol id="lb"></ol>
              <button id="lbx" class="lnk">Expand ⤢</button>
            </div>
          </div>
          <div id="mid">
            <div id="bar">
              <img class="mini" alt="" />
              <div class="stats">
                <span>Hits <b id="mh">0</b></span
                ><span>Balls <b id="mb">1</b></span
                ><span>Best <b id="mbh">0</b></span>
              </div>
              <div id="tbox"></div>
            </div>
            <div id="g">
              <canvas id="cv" width="1404" height="1620"></canvas>
              <div class="tools">
                <button id="ff" title="Fast forward" aria-label="Fast forward">
                  ⏩</button
                ><button id="snd" class="on" title="Sound" aria-label="Sound">
                  🔊
                </button>
              </div>
              <div id="ov">
                <img id="oi" alt="" />
                <h1 id="t">Maddy Blast</h1>
                <p id="d">
                  Drag to aim, let go to fire. Break every maddy before it
                  reaches the floor. Catch the +1 orbs for more balls. Good luck...
                </p>
                <input
                  id="nm"
                  maxlength="12"
                  placeholder="Your name"
                  autocomplete="off"
                  aria-label="Your name"
                /><button id="go">Play</button>
                <p id="lbo"></p>
              </div>
            </div>
            <div id="strip">
              <button id="lbtn" class="ib" aria-label="Show full leaderboard">
                🏆
              </button>
              <ol id="lb2"></ol>
            </div>
          </div>
          <div class="side">
            <img class="mas flip" alt="" />
            <div class="card"><span>Balls</span><b id="sb">1</b></div>
            <div class="card hi"><span>Best balls</span><b id="sbb">1</b></div>
          </div>
        </div>
      </div>
    </div>
    <!-- Expanded leaderboard shown above the game when requested. -->
    <div id="lbm" hidden>
      <div class="mb">
        <div class="mh">
          <span>Leaderboard</span><button id="lbc" aria-label="Close">✕</button>
        </div>
        <div class="ms">
          <table id="lbt">
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Hits</th>
                <th>Balls</th>
                <th>Turns</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

      const DB = DB_URL.trim().replace(/\/$/, ""),

      let remote = {},

      // Build safe Firebase keys and provide defaults for new players.
      function key(n) {
        return n
          .toLowerCase()
          .replace(/[.$#\[\]\/\u0000-\u001f]/g, "_")
          .slice(0, 12);
      }
      function rec() {
        return scores[key(player)] || { n: player, t: 0, b: 1, h: 0 };
      }

      // ---- Firebase requests and leaderboard rendering ----
      function renderModal(rows) {
        const trs = rows.map((r, i) => {
          const tr = document.createElement("tr");
          if (key(r.n) == key(player)) tr.className = "me";
          [i + 1, r.n, r.h, r.b, r.t].forEach((v) => {
            const td = document.createElement("td");
            td.textContent = v;
            tr.append(td);
          });
          return tr;
        });
        if (!trs.length) {
          const tr = document.createElement("tr"),
            td = document.createElement("td");
          td.colSpan = 5;
          td.textContent = "No scores yet";
          tr.append(td);
          trs.push(tr);
        }
        lbt.replaceChildren(...trs);
      }
      async function tf(path, opt) {
        const c = new AbortController(),
          t = setTimeout(() => c.abort(), 5000);
        try {
          const r = await fetch(DB + path, { ...opt, signal: c.signal });
          if (!r.ok) throw 0;
          return await r.json();
        } finally {
          clearTimeout(t);
        }
      }
      async function loadTop() {
        if (!ONLINE) return;
        try {
          remote =
            (await tf("/scores.json?orderBy=%22h%22&limitToLast=50")) || {};
          remoteOK = true;
        } catch (e) {
          remoteOK = false;
        }
        renderLB();
      }
      async function push() {
        if (!ONLINE || !player) return;
        const r = scores[key(player)];
        if (!r) return;
        const body = JSON.stringify({ n: r.n, t: r.t, b: r.b, h: r.h });
        if (body === lastPush) return;
        lastPush = body;
        try {
          await tf("/scores/" + encodeURIComponent(key(player)) + ".json", {
            method: "PUT",
            body,
          });
          loadTop();
        } catch (e) {
          lastPush = "";
        }
      }
      async function sync() {
        if (!ONLINE) return;
        try {
          const r = await tf(
            "/scores/" + encodeURIComponent(key(player)) + ".json",
          );
          if (r && typeof r.h == "number") {
            const o = rec();
            scores[key(player)] = {
              n: player,
              t: Math.max(o.t, +r.t || 0),
              b: Math.max(o.b, +r.b || 1),
              h: Math.max(o.h, +r.h || 0),
            };
          }
        } catch (e) {}
        loadTop();
      }
      const lbt = document.querySelector("#lbt tbody"),

        lb2 = document.getElementById("lb2"),

        lbo = document.getElementById("lbo"),
        nm = document.getElementById("nm");
      function renderLB() {
        const all = {};
        // Local and Firebase copies can have different database keys; merge by player name.
        for (const r of [...Object.values(scores), ...Object.values(remote)]) {
          if (!r || typeof r.n !== "string") continue;
          const id = key(r.n),
            old = all[id],
            t = Number(r.t) || 0,
            b = Number(r.b) || 1,
            h = Number(r.h) || 0;
          all[id] = old
            ? {
                n: old.n || r.n,
                t: Math.max(old.t, t),
                b: Math.max(old.b, b),
                h: Math.max(old.h, h),
              }
            : { n: r.n.slice(0, 12), t, b, h };
        }
        const ranked = Object.values(all)
            .sort((a, b) => b.h - a.h || b.t - a.t)
            .slice(0, 50),
          top = ranked.slice(0, 5);
        document.getElementById("lbh").textContent = !ONLINE
          ? "Leaderboard (this device)"
          : remoteOK
            ? "Leaderboard"
            : "Leaderboard (offline)";
        const mk = (r) => {
          const li = document.createElement("li"),
            a = document.createElement("span"),
            b = document.createElement("b");
          if (key(r.n) == key(player)) li.className = "me";
          a.textContent = r.n;
          b.textContent = r.h;
          li.append(a, b);
          return li;
        };
        const items = top.map(mk);
        lb2.replaceChildren(...ranked.map(mk));
        renderModal(ranked);
        if (!items.length) {
          const li = document.createElement("li");
          li.className = "none";
          li.textContent = "No scores yet";
          items.push(li);
        }
        lbEl.replaceChildren(...items);
        if (!top.length) lb2.replaceChildren(items[0].cloneNode(true));
        lbo.textContent = top.length
          ? "Top hits: " + top.map((r) => r.n + " " + r.h).join(" · ")
          : "";
      }
      const sEls = ["sh", "sbh", "sb", "sbb", "mh", "mbh", "mb"].map((k) =>
        document.getElementById(k),
      );
      function upd() {
        const bh = Math.max(bestHits, hits),
          bb = Math.max(bestBalls, total),
          v = [hits, bh, total, bb, hits, bh, total];
        sEls.forEach((e, i) => {
          if (e.textContent != v[i]) e.textContent = v[i];
        });
      }
      function saveBest() {
        bestBalls = Math.max(bestBalls, total);
        bestHits = Math.max(bestHits, hits);
        if (level - 1 > best) best = level - 1;
        if (!player) return;
        scores[key(player)] = { n: player, t: best, b: bestBalls, h: bestHits };
        try {
          localStorage.setItem("rb_scores", JSON.stringify(scores));
        } catch (e) {}
        renderLB();
        push();
      }

        ov = document.getElementById("ov");
      let init = false;
      let vw = 0,
        vh = 0;
      function dims() {
        if (!(document.activeElement === nm && vw)) {
          vw = stage.clientWidth;
          vh = stage.clientHeight;
        }
        return [vw, vh];
      }
      function wideNow() {
        const [a, b] = dims();
        return a >= 600 && a >= b * 1.2;
      }
      function layout() {
        const [sw, sh] = dims();
        isWide = wideNow();
        if (isWide) {
          if (sh < 520) {
            C = 11;
            R = 6;
          } else {
            C = 9;
            R = 8;
          }
        } else {
          C = 7;
          R = Math.max(
            7,
            Math.min(
              12,
              Math.floor(((sh - 104) / (sw / (C * CS)) - TOP - 66) / CS),
            ),
          );
        }
        W = C * CS;
        FLOOR = TOP + R * CS;
        LY = FLOOR + 16;
        H = LY + 50;
        cv.width = W * 3;
        cv.height = H * 3;
        ctx.setTransform(3, 0, 0, 3, 0, 0);
      }
      function fit() {
        if (init && !ov.classList.contains("hide")) {
          layout();
          reset();
        }
        const [sw0, sh] = dims(),
          wide = wideNow(),
          sd = wide ? Math.min(230, sw0 * 0.2, sh * 0.34) : 0;
        wrap.classList.toggle("wide", wide);
        wrap.classList.toggle("narrow", !wide);
        wrap.classList.toggle("short", wide && sh < 520);
        const tp = wide ? g : tbox;
        if (tools.parentNode !== tp) tp.insertBefore(tools, wide ? ov : null);
        document
          .querySelectorAll(".side")
          .forEach((e) => (e.style.width = sd + "px"));
        const s = wide
          ? Math.min((sw0 - 2 * sd - 32) / W, (sh - 10) / H)
          : Math.min(sw0 / W, (sh - 104) / H);
        g.style.width = W * s + "px";
        g.style.height = H * s + "px";
        bar.style.width = strip.style.width = W * s + "px";
      }
      addEventListener("resize", fit);
      layout();
      fit();

      // ---- Audio and game mechanics ----
      function sfx(f, d = 0.05) {
        if (!sound || !ac) return;
        const n = performance.now();
        if (sfx.t && n - sfx.t < 30) return;
        sfx.t = n;
        const o = ac.createOscillator(),
          v = ac.createGain();
        o.type = "square";
        o.frequency.value = f;
        v.gain.value = 0.025;
        v.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
        o.connect(v);
        v.connect(ac.destination);
        o.start();
        o.stop(ac.currentTime + d);
      }
      function hue(h) {
        return Math.max(0, 150 - Math.min(h, 42) * 3.4);
      }
      function addRow() {
        bricks = bricks.filter((b) => {
          b.r++;
          return !(b.t == "ball" && b.r >= R);
        });
        const pc = Math.floor(Math.random() * C);
        let any = false;
        for (let c = 0; c < C; c++) {
          if (c == pc) {
            bricks.push({ c, r: 0, y: -CS, t: "ball" });
            continue;
          }
          if (Math.random() < 0.52) {
            any = true;
            const hp = Math.random() < 0.18 ? level * 2 : level;
            bricks.push({ c, r: 0, y: -CS, t: "b", hp, fl: 0 });
          }
        }
        if (!any) {
          const c = (pc + 1) % C;
          bricks.push({ c, r: 0, y: -CS, t: "b", hp: level, fl: 0 });
        }
      }
      function reset() {
        bricks = [];
        balls = [];
        parts = [];
        level = 1;
        total = 1;
        gained = 0;
        hits = 0;
        lx = W / 2;
        ang = -Math.PI / 2;
        aiming = false;
        mode = "aim";
        fired = 0;
        first = null;
        for (let i = 0; i < 3; i++) {
          addRow();
          bricks.forEach((b) => (b.y = b.r * CS));
        }
      }

      // Fire balls and create particles when bricks are destroyed.
      function fire() {
        balls.push({
          x: lx,
          y: LY - 1,
          vx: Math.cos(ang) * SP,
          vy: Math.sin(ang) * SP,
          live: 1,
        });
        fired++;
        sfx(300, 0.04);
      }
      function burst(x, y, h) {
        for (let i = 0; i < 14; i++) {
          const a = Math.random() * 6.3,
            s = 1 + Math.random() * 3.5;
          parts.push({
            x,
            y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s - 1,
            l: 30 + Math.random() * 15,
            h,
          });
        }
      }
      function hit(b2) {
        for (const b of bricks) {
          const x = b.c * CS + 2,
            y = b.r * CS + TOP + 2,
            s = CS - 4;
          if (b.t == "ball") {
            if (Math.hypot(b2.x - (x + s / 2), b2.y - (y + s / 2)) < BR + 10) {
              b.dead = 1;
              gained++;
              sfx(900, 0.1);
            }
            continue;
          }
          const px = Math.max(x, Math.min(b2.x, x + s)),
            py = Math.max(y, Math.min(b2.y, y + s));
          const dx = b2.x - px,
            dy = b2.y - py,
            d = Math.hypot(dx, dy);
          if (d < BR) {
            if (d < 0.001) {
              b2.vy = -Math.abs(b2.vy);
              b2.y -= 2;
            } else {
              const nx = dx / d,
                ny = dy / d;
              b2.x += nx * (BR - d);
              b2.y += ny * (BR - d);
              const dt = b2.vx * nx + b2.vy * ny;
              if (dt < 0) {
                b2.vx -= 2 * dt * nx;
                b2.vy -= 2 * dt * ny;
                if (Math.abs(b2.vy) < 1.5) {
                  b2.vy = (b2.vy < 0 ? -1 : 1) * 1.5;
                  const m = Math.hypot(b2.vx, b2.vy);
                  b2.vx *= SP / m;
                  b2.vy *= SP / m;
                }
              }
            }
            b.hp--;
            hits++;
            b.fl = 6;
            sfx(180 + Math.min(b.hp, 30) * 8, 0.05);
            if (b.hp <= 0) {
              b.dead = 1;
              burst(x + s / 2, y + s / 2, hue(level));
              sfx(120, 0.12);
            }
          }
        }
        if (bricks.some((b) => b.dead)) bricks = bricks.filter((b) => !b.dead);
      }

      // Finish the volley, advance the board, and detect the end of a game.
      function endTurn() {
        lx = first == null ? lx : first;
        total += gained;
        gained = 0;
        level++;
        addRow();
        balls = [];
        fired = 0;
        first = null;
        runT = 0;
        mode = "aim";
        saveBest();
        if (bricks.some((b) => b.t == "b" && b.r >= R)) over();
      }
      function over() {
        mode = "over";
        const sc = level - 1;
        saveBest();
        document.getElementById("t").textContent = "Maddy wins :(";
        document.getElementById("d").textContent =
          "They reached the floor. You lasted " +
          sc +
          " turns. Best: " +
          best +
          ".";
        document.getElementById("go").textContent = "Play again";
        document.getElementById("ov").classList.remove("hide");
      }
      function step() {
        if (mode == "run") {
          runT++;
          if (fired < total && --ft <= 0) {
            fire();
            ft = 5;
          }
          for (const b of balls) {
            if (!b.live) continue;
            for (let k = 0; k < 3; k++) {
              b.x += b.vx / 3;
              b.y += b.vy / 3;
              if (b.x < BR) {
                b.x = BR;
                b.vx = Math.abs(b.vx);
              }
              if (b.x > W - BR) {
                b.x = W - BR;
                b.vx = -Math.abs(b.vx);
              }
              if (b.y < TOP + BR) {
                b.y = TOP + BR;
                b.vy = Math.abs(b.vy);
              }
              hit(b);
              if (b.y >= LY && b.vy > 0) {
                b.live = 0;
                if (first == null) first = Math.max(BR, Math.min(W - BR, b.x));
                break;
              }
            }
            if (runT > 1500) b.vy += 0.03;
          }
          if (fired >= total && !balls.some((b) => b.live)) endTurn();
        }
        for (const b of bricks) {
          b.y += (b.r * CS - b.y) * 0.22;
          if (b.fl > 0) b.fl--;
        }
        for (const p of parts) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.15;
          p.l--;
        }
        parts = parts.filter((p) => p.l > 0);
      }

      // ---- Canvas drawing and animation loop ----
      function rr(x, y, w, h, r) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
      }
      function draw() {
        ctx.fillStyle = "#1b1022";
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = "rgba(255,255,255,.04)";
        ctx.lineWidth = 1;
        for (let i = 1; i < C; i++) {
          ctx.beginPath();
          ctx.moveTo(i * CS, TOP);
          ctx.lineTo(i * CS, FLOOR + 30);
          ctx.stroke();
        }
        ctx.fillStyle = "rgba(214,40,57,.25)";
        ctx.fillRect(0, FLOOR + 1, W, 2);
        for (const b of bricks) {
          const x = b.c * CS + 2,
            y = b.y + TOP + 2,
            s = CS - 4;
          if (b.t == "ball") {
            ctx.strokeStyle = "#fff3e4";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x + s / 2, y + s / 2, 11, 0, 7);
            ctx.stroke();
            ctx.fillStyle = "#fff3e4";
            ctx.font = "800 12px system-ui,sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("+1", x + s / 2, y + s / 2 + 4);
            continue;
          }
          const h = hue(b.hp);
          rr(x, y, s, s, 9);
          ctx.fillStyle = "hsl(" + h + " 50% 24%)";
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = "hsl(" + h + " 70% 55%)";
          ctx.stroke();
          if (img.complete && img.naturalWidth) {
            const k = Math.min(
                (s - 6) / img.naturalWidth,
                (s - 6) / img.naturalHeight,
              ),
              w = img.naturalWidth * k,
              hh = img.naturalHeight * k;
            ctx.drawImage(img, x + (s - w) / 2, y + (s - hh) / 2 - 2, w, hh);
          }
          if (b.fl > 0) {
            rr(x, y, s, s, 9);
            ctx.fillStyle = "rgba(255,255,255," + b.fl * 0.07 + ")";
            ctx.fill();
          }
          const t = String(b.hp);
          ctx.font = "800 14px system-ui,sans-serif";
          ctx.textAlign = "center";
          const tw = ctx.measureText(t).width + 12;
          rr(x + s / 2 - tw / 2, y + s - 17, tw, 16, 8);
          ctx.fillStyle = "rgba(15,8,19,.85)";
          ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.fillText(t, x + s / 2, y + s - 5);
        }
        for (const p of parts) {
          ctx.fillStyle =
            "hsla(" + p.h + ",70%,60%," + Math.min(1, p.l / 20) + ")";
          ctx.fillRect(p.x, p.y, 4, 4);
        }
        if (aiming && aimOK && mode == "aim") {
          let x = lx,
            y = LY,
            dx = Math.cos(ang),
            dy = Math.sin(ang);
          ctx.fillStyle = "rgba(255,243,228,.6)";
          for (let i = 0; i < 160; i++) {
            x += dx * 5;
            y += dy * 5;
            if (x < BR || x > W - BR) {
              dx = -dx;
              x = Math.max(BR, Math.min(W - BR, x));
            }
            if (y < TOP + BR) break;
            if (
              bricks.some(
                (b) =>
                  b.t == "b" &&
                  x > b.c * CS &&
                  x < (b.c + 1) * CS &&
                  y > b.r * CS + TOP &&
                  y < (b.r + 1) * CS + TOP,
              )
            )
              break;
            if (i % 3 == 0) {
              ctx.beginPath();
              ctx.arc(x, y, 2, 0, 7);
              ctx.fill();
            }
          }
        }
        ctx.fillStyle = "#fff3e4";
        for (const b of balls)
          if (b.live) {
            ctx.beginPath();
            ctx.arc(b.x, b.y, BR, 0, 7);
            ctx.fill();
          }
        if (mode == "aim" || fired < total) {
          ctx.beginPath();
          ctx.arc(lx, LY, BR, 0, 7);
          ctx.fill();
          ctx.font = "700 12px system-ui,sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(
            "x" + (total - fired),
            lx,
            LY + 22 > H - 4 ? H - 4 : LY + 20,
          );
        }
        ctx.fillStyle = "#120a18";
        ctx.fillRect(0, 0, W, TOP);
        ctx.fillStyle = "#d62839";
        ctx.fillRect(0, TOP - 3, W, 3);
        ctx.textAlign = "left";
        ctx.fillStyle = "#fff3e4";
        ctx.font = '400 26px Impact,"Arial Black",sans-serif';
        ctx.fillText("Turn " + level, 14, 32);
        ctx.font = "700 14px system-ui,sans-serif";
        ctx.fillStyle = "#ffd166";
        ctx.fillText(player, 120, 32);
        ctx.font = "600 12px system-ui,sans-serif";
        ctx.fillStyle = "#c9b8cf";
        ctx.fillText(
          "Best " + best + "   Balls " + total + "   Hits " + hits,
          14,
          48,
        );
        upd();
      }
      let last = 0,
        acc = 0;
      function loop(t) {
        acc += Math.min(t - last, 100);
        last = t;
        while (acc >= 16.67) {
          acc -= 16.67;
          for (let i = 0; i < (ff ? 3 : 1); i++) step();
        }
        draw();
        marq();
        requestAnimationFrame(loop);
      }

      // ---- Pointer controls, game start, and leaderboard dialog ----
      function pt(e) {
        const r = cv.getBoundingClientRect();
        return {
          x: ((e.clientX - r.left) / r.width) * W,
          y: ((e.clientY - r.top) / r.height) * H,
        };
      }
      function aimAt(e) {
        const p = pt(e),
          dx = p.x - lx,
          dy = p.y - LY;
        aimOK = dy < -12;
        if (aimOK) {
          ang = Math.max(-Math.PI + 0.12, Math.min(-0.12, Math.atan2(dy, dx)));
        }
      }
      cv.addEventListener("pointerdown", (e) => {
        if (!ac) {
          try {
            ac = new (window.AudioContext || window.webkitAudioContext)();
          } catch (x) {}
        }
        if (mode != "aim") return;
        cv.setPointerCapture(e.pointerId);
        aiming = true;
        aimAt(e);
      });
      cv.addEventListener("pointermove", (e) => {
        if (aiming) aimAt(e);
      });
      cv.addEventListener("pointerup", (e) => {
        if (!aiming) return;
        aiming = false;
        if (mode == "aim" && aimOK) {
          mode = "run";
          fired = 0;
          ft = 1;
          runT = 0;
          first = null;
          balls = [];
        }
      });
      cv.addEventListener("pointercancel", () => {
        aiming = false;
      });
      document.getElementById("ff").onclick = (e) => {
        ff = !ff;
        e.currentTarget.classList.toggle("on", ff);
      };
      document.getElementById("snd").onclick = (e) => {
        sound = !sound;
        e.currentTarget.classList.toggle("on", sound);
        e.currentTarget.textContent = sound ? "🔊" : "🔇";
      };
      async function begin() {
        if (busy) return;
        const n = nm.value.trim().slice(0, 12);
        if (!n) {
          nm.classList.remove("err");
          void nm.offsetWidth;
          nm.classList.add("err");
          nm.focus();
          return;
        }
        busy = true;
        const go = document.getElementById("go");
        go.disabled = true;
        if (!ac) {
          try {
            ac = new (window.AudioContext || window.webkitAudioContext)();
          } catch (x) {}
        }
        player = n;
        try {
          localStorage.setItem("rb_player", n);
        } catch (e) {}
        const full = vh;
        nm.blur();
        await sync();
        for (let i = 0; i < 14 && stage.clientHeight < full - 20; i++)
          await new Promise((r) => setTimeout(r, 50));
        layout();
        fit();
        const r = rec();
        best = r.t;
        bestBalls = r.b;
        bestHits = r.h;
        reset();
        renderLB();
        document.getElementById("ov").classList.add("hide");
        go.disabled = false;
        busy = false;
      }
      document.getElementById("go").onclick = begin;
      nm.addEventListener("keydown", (e) => {
        if (e.key == "Enter") begin();
      });
      nm.addEventListener("input", () => nm.classList.remove("err"));
      nm.addEventListener("focus", () => ov.classList.add("kb"));
      nm.addEventListener("blur", () => {
        ov.classList.remove("kb");
        setTimeout(fit, 300);
      });
      function openLB() {
        lbm.hidden = false;
        loadTop();
        document.getElementById("lbc").focus();
      }
      function closeLB() {
        lbm.hidden = true;
      }
      document.getElementById("lbx").onclick = openLB;
      document.getElementById("lbtn").onclick = openLB;
      document.getElementById("lbc").onclick = closeLB;
      lbm.addEventListener("click", (e) => {
        if (e.target === lbm) closeLB();
      });
      addEventListener("keydown", (e) => {
        if (e.key == "Escape") closeLB();
      });
      // Pause automatic ticker movement while the player interacts with it.
      let hold = 0,
        mpos = 0,
        mdir = 1;
      const still = matchMedia("(prefers-reduced-motion:reduce)").matches;
      ["pointerdown", "wheel", "touchstart"].forEach((ev) =>
        lb2.addEventListener(
          ev,
          () => {
            hold = performance.now() + 5000;
          },
          { passive: true },
        ),
      );
      function marq() {
        if (still || lb2.scrollWidth <= lb2.clientWidth + 2) return;
        if (performance.now() < hold) {
          mpos = lb2.scrollLeft;
          return;
        }
        mpos += 0.5 * mdir;
        if (mpos <= 0) {
          mpos = 0;
          mdir = 1;
        } else if (mpos >= lb2.scrollWidth - lb2.clientWidth) {
          mpos = lb2.scrollWidth - lb2.clientWidth;
          mdir = -1;
        }
        lb2.scrollLeft = mpos;
      }
      // Restore the saved player, load leaderboard data, and start animation.
      nm.value = player;
      renderLB();
      loadTop();
      init = true;
      setInterval(() => {
        if (!document.hidden) loadTop();
      }, 30000);
      reset();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
